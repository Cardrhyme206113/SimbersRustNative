[package]
name = "simbers-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Windows Beat Saber map generation — Rust audio processing and UI"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts"] }
rfd = "0.15.4"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "vorbis", "flac", "wav", "aac", "isomp4", "alac", "pcm"] }
rustfft = "6.2.0"
rusty_vorbis = "0.1.3"
ogg = "0.9.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
rodio = "0.20.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.performance]
inherits = "release"
opt-level = 3

[package.metadata]
corpus_records = 121106
corpus_format = "Simbers human-bitfield-v1"
