name: Build native Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - name: Checkout Rust source
        uses: actions/checkout@v4

      - name: Install Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release executable
        shell: pwsh
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify standalone executable
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/simbers-native.exe"
          if (!(Test-Path $exe)) { throw "The expected Windows EXE was not produced." }
          Write-Host "EXE size: $((Get-Item $exe).Length) bytes"
          Get-FileHash $exe -Algorithm SHA256

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SimbersNative-Windows-x64
          path: target/x86_64-pc-windows-msvc/release/simbers-native.exe
          if-no-files-found: error
          retention-days: 30
